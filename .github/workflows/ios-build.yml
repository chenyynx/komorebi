name: iOS Build

on:
  push:
    branches: [main]
    # Docs, server (Node) and Android-only changes never ship an iOS binary —
    # keep them out of the macOS build queue.
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - 'Design/**'
      - 'server/**'
      - 'androidApp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Upstream code uses iOS 26 SDK APIs (ToolbarSpacer, .glass material,
    # new interpolation overloads) — Xcode 16.x cannot compile it.
    # Public repo: GitHub-hosted macOS minutes are free and unlimited.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pin Xcode 26.2 (stable)
        # Runner-image rollouts move the default Xcode (26.5 -> 26.6 killed
        # xcodebuild silently mid-build on the sibling project). Pin the last
        # known-good so builds are reproducible.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Cache Gradle + Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: kmp-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'shared/src/**', 'gradle.properties') }}
          restore-keys: kmp-${{ runner.os }}-

      # The Komorebi target has a build phase that itself runs
      # `gradlew :shared:linkReleaseFrameworkIosArm64`; xcodebuild drives it.
      # Unsigned on purpose — the phone signs locally (KSign flow).
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Komorebi.xcodeproj \
            -scheme Komorebi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData

      - name: Package ipa
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/Komorebi.app build/Payload/
          BUILD_NO=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" build/Payload/Komorebi.app/Info.plist
          echo "CFBundleVersion = $BUILD_NO"
          cd build && zip -qr Komorebi-unsigned.ipa Payload

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: Komorebi-unsigned-${{ github.sha }}
          path: build/Komorebi-unsigned.ipa
